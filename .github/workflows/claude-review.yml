# Claude reviews every pull request when it's opened or gets new commits, and
# leaves comments. It only reads and comments; it never pushes changes.
# Needs: the Claude GitHub App on this repo and an ANTHROPIC_API_KEY repository secret.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check that the Anthropic API key secret is set
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Skipped: add the ANTHROPIC_API_KEY repository secret to turn on Claude."; fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - if: steps.key.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allow_fork_prs: "false"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            Read CLAUDE.md first and hold the change to it. Focus on:
            - bugs and edge cases (dates, time zones, drag and drop, sync conflicts)
            - security: secrets or .env values in the diff, Supabase row-level security,
              user text rendered as HTML, the Anthropic key leaving the device
            - data safety: anything that could delete or overwrite a person's planner data
            - accessibility and the phone layout
            - copy and design that break the rules in CLAUDE.md
            Skip style nits a formatter would catch. If the change is fine, say so in one line.

            Use `gh pr comment` for overall feedback and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for specific lines. Only post GitHub comments; don't reply with review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
