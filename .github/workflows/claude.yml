# Mention @claude in an issue, a pull request comment or a review to have Claude
# answer, investigate or make the change on a branch.
# Needs: the Claude GitHub App on this repo and an ANTHROPIC_API_KEY repository secret.
# Only people with write access to the repo can trigger it (the action's default).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check that the Anthropic API key secret is set
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Skipped: add the ANTHROPIC_API_KEY repository secret to turn on Claude."; fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - if: steps.key.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allow_fork_prs: "false"
          claude_args: "--max-turns 30"
